name: Build ParkFame Android APK
on:
  workflow_dispatch: {}
  push:
    paths: ['ParkFame/parkfame/mobile/**', '.github/workflows/build-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Create Flutter project around our source
        run: |
          flutter create --org com.parkfame --project-name parkfame --platforms=android app
          rm -rf app/lib && cp -r ParkFame/parkfame/mobile/lib app/lib
          cd app
          flutter pub add firebase_core firebase_auth http image_picker google_mlkit_text_recognition provider intl google_fonts:^6.2.1
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle*
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: app
        run: >
          flutter build apk --release
          --dart-define=API_URL=${{ secrets.API_URL }}
          --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }}
          --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }}
          --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }}
          --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: parkfame-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
